<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Tabla de posiciones - privado</title>
<style>
  :root{
    --bg:#f3ead3; --card:#fffdf8; --ink:#2b1810; --muted:#7c6c4c;
    --accent:#d5401f; --pill:#fbe0d8;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    padding:24px 16px 60px;
  }
  .wrap{max-width:480px;margin:0 auto;}
  .brand{display:flex;align-items:center;gap:10px;margin-bottom:20px;}
  .brand .logo{font-size:28px;}
  .brand b{font-size:22px;letter-spacing:0.5px;}
  .pill{display:inline-block;background:var(--pill);color:var(--accent);font-size:12px;font-weight:700;
    letter-spacing:1px;padding:5px 12px;border-radius:20px;margin-bottom:14px;}
  h1{font-size:26px;line-height:1.2;margin:0 0 14px;font-weight:800;}
  .card{background:var(--card);border-radius:16px;padding:22px;margin-bottom:16px;
    box-shadow:0 2px 10px rgba(0,0,0,.05);}
  .board-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;
    border-bottom:1px solid #f0e6cc;font-size:15px;}
  .board-row:last-child{border-bottom:none;}
  .board-row .pos{width:26px;color:var(--muted);font-weight:700;}
  .board-row .cnt{font-weight:800;color:var(--accent);}
  .footline{font-size:12px;color:var(--muted);line-height:1.5;margin:14px 0 0;}
  button{
    display:inline-block;border:none;border-radius:10px;
    padding:12px 16px;font-size:14px;font-weight:700;cursor:pointer;
    background:var(--pill);color:var(--accent);
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="brand"><span class="logo">🎁</span><b>NEIBA</b></div>
  <span class="pill">SOLO PARA VOS</span>
  <h1>Tabla de posiciones</h1>
  <div class="card">
    <div id="board">Cargando...</div>
    <p class="footline">Esta pagina no esta linkeada desde ningun lado publico. Guarda el link vos solo.</p>
    <button id="refresh-btn" type="button">Actualizar</button>
  </div>
</div>
<script>
(function(){
  var API_BASE = "https://script.google.com/macros/s/AKfycbxCBi0eZZ6IfrcHSCW6MhR36gaXopj29A0LVWGM7OKFymjfqk0ypTbuh5sZZGczyMD48A/exec";
  function $(id){ return document.getElementById(id); }
  function escHtml(t){ return (t||"").toString().split("&").join("&amp;").split("<").join("&lt;").split(">").join("&gt;"); }

  function renderBoard(rows){
    var el = $("board");
    if (!rows || !rows.length){ el.innerHTML = '<p class="footline" style="margin:0;">Todavia no hay nadie en la tabla.</p>'; return; }
    var html = "";
    rows.forEach(function(r, i){
      html += '<div class="board-row"><span class="pos">' + (i+1) + '</span><span>' + escHtml(r.name) + '</span><span class="cnt">' + r.count + '</span></div>';
    });
    el.innerHTML = html;
  }

  function loadBoard(){
    $("board").textContent = "Cargando...";
    fetch(API_BASE + "?api=board").then(function(r){ return r.json(); }).then(renderBoard).catch(function(){
      $("board").innerHTML = '<p class="footline" style="margin:0;">No se pudo cargar la tabla.</p>';
    });
  }

  $("refresh-btn").addEventListener("click", loadBoard);
  loadBoard();
})();
</script>
</body>
</html>
